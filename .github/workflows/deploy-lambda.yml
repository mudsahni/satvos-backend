name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambda/ses_invoice_processor/**'
      - 'lambda/requirements.txt'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: satvos-uploads
  S3_PREFIX: lambda-deployments/ses-inbound-satvos
  LAMBDA_FUNCTION: ses-inbound-satvos

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r lambda/requirements.txt -r lambda/requirements-dev.txt

      - name: Run tests
        run: cd lambda && PYTHONPATH=. pytest tests/ -v

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda zip
        run: |
          cd lambda
          rm -rf package lambda.zip
          pip install -r requirements.txt -t package/
          cp -r ses_invoice_processor package/
          cd package && zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::353922334273:role/github-actions-lambda-deploy
          aws-region: ap-south-1

      - name: Upload to S3
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          aws s3 cp lambda/lambda.zip "s3://${S3_BUCKET}/${S3_PREFIX}/${COMMIT_SHA}.zip"
          aws s3 cp lambda/lambda.zip "s3://${S3_BUCKET}/${S3_PREFIX}/latest.zip"

      - name: Update Lambda function
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "${S3_PREFIX}/${COMMIT_SHA}.zip"

      - name: Verify deployment
        run: |
          aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Configuration.LastModified' --output text
